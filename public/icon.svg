<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a14"/>
      <stop offset="100%" stop-color="#141428"/>
    </linearGradient>
    <radialGradient id="aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4f8cff" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#7c5cff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="atomGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7fd8ff"/>
      <stop offset="50%" stop-color="#9ab8ff"/>
      <stop offset="100%" stop-color="#c7a8ff"/>
    </linearGradient>
    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>
  <!-- 背景 -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="260" fill="url(#aura)"/>
  <!-- 磨砂玻璃底板 -->
  <rect x="54" y="54" width="404" height="404" rx="84"
        fill="rgba(18,20,32,0.55)"
        stroke="rgba(255,255,255,0.14)" stroke-width="2"/>
  <!-- 原子发光光晕 -->
  <g transform="translate(256 256)" opacity="0.55" filter="url(#softBlur)">
    <ellipse cx="0" cy="0" rx="160" ry="56" fill="#7fd8ff"/>
    <ellipse cx="0" cy="0" rx="160" ry="56" fill="#c7a8ff" transform="rotate(60)"/>
    <ellipse cx="0" cy="0" rx="160" ry="56" fill="#9ab8ff" transform="rotate(-60)"/>
    <circle cx="0" cy="0" r="34" fill="#ffffff"/>
  </g>
  <!-- 原子主体（三轨道 + 中心核） -->
  <g transform="translate(256 256)" fill="none" stroke="url(#atomGlow)" stroke-width="8" stroke-linecap="round">
    <ellipse cx="0" cy="0" rx="160" ry="56"/>
    <ellipse cx="0" cy="0" rx="160" ry="56" transform="rotate(60)"/>
    <ellipse cx="0" cy="0" rx="160" ry="56" transform="rotate(-60)"/>
    <circle cx="0" cy="0" r="30" fill="url(#atomGlow)" stroke="none"/>
  </g>
  <!-- 电子小点 -->
  <g fill="#ffffff">
    <circle cx="256" cy="200" r="9"/>
    <circle cx="376" cy="302" r="9"/>
    <circle cx="142" cy="310" r="9"/>
  </g>
</svg>
